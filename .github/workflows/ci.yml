name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copyr
          POSTGRES_PASSWORD: copyr
          POSTGRES_DB: copyr
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U copyr -d copyr"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://copyr:copyr@localhost:5433/copyr
      AI_PROVIDER: mock
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: copyr-local
      STORAGE_ACCESS_KEY_ID: copyr-dev
      STORAGE_SECRET_ACCESS_KEY: copyr-dev-secret
      STORAGE_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start MinIO (best-effort)
        run: |
          set +e
          for image in quay.io/minio/minio:latest minio/minio:latest; do
            echo "Trying $image"
            docker rm -f minio >/dev/null 2>&1
            if docker run -d --name minio \
              -p 9000:9000 \
              -e MINIO_ROOT_USER=copyr-dev \
              -e MINIO_ROOT_PASSWORD=copyr-dev-secret \
              "$image" server /data; then
              for i in $(seq 1 40); do
                if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
                  echo "MinIO is ready ($image)"
                  exit 0
                fi
                sleep 1
              done
              docker logs minio || true
              docker rm -f minio >/dev/null 2>&1
            fi
          done
          echo "MinIO not available; smoke will skip (same as storage tests skipIf)"
          exit 0
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - name: migrate + seed (schema for integration tests)
        run: |
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm test
      - name: smoke (full pipeline)
        run: pnpm smoke
      - name: build web
        run: pnpm --filter @copyr/web build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: false
