name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copyr
          POSTGRES_PASSWORD: copyr
          POSTGRES_DB: copyr
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U copyr -d copyr"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://copyr:copyr@localhost:5433/copyr
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - name: migrate + seed (schema for integration tests)
        run: |
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm test
      - name: smoke (full pipeline)
        run: pnpm smoke
      - name: build web
        run: pnpm --filter @copyr/web build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: false
