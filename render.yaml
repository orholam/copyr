# Copyr API — Render Blueprint (long-running Fastify + pg-boss workers)
# https://render.com/docs/blueprint-spec
#
# Fastify is not adapted to Vercel serverless (SSE, 100MB uploads, in-process
# workers). This service is the production API; the Vite SPA deploys on Vercel.

services:
  - type: web
    name: copyr-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    # Runs drizzle migrations in the new image before traffic switches.
    # Independent of AUTO_MIGRATE (a dashboard "false" previously skipped 0007).
    # Paid instances only; on a free plan set Pre-Deploy Command in the dashboard
    # or flip AUTO_MIGRATE=true and restart.
    preDeployCommand: pnpm db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      # Dashboard env overrides this blueprint. Leave unset or "true".
      # "false" is what left companies.archived_at / stage_id missing on venlabs-demo.
      - key: AUTO_MIGRATE
        value: "true"
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: DATABASE_SSL
        value: auto
      - key: STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: STORAGE_BUCKET
        value: copyr
      - key: STORAGE_ENDPOINT
        value: https://cdsngnauduhiaidzncie.storage.supabase.co/storage/v1/s3
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_URL
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: INBOUND_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEV_WORKSPACE_SLUG
        value: harbor-ventures
      - key: ALLOW_DEV_WORKSPACE_AUTH
        value: "false"
      - key: SUPABASE_URL
        value: https://cdsngnauduhiaidzncie.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
