<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
    <title>VentureLabs — AI deal flow CRM for venture capital</title>
    <script>
      try {
        var t = localStorage.getItem("copyr-theme");
        var sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (t === "dark" || (!t && sys)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <meta name="description" content="Say goodbye to expired links, manual data entry and half-filled CRMs. VentureLabs turns emails and decks into pipeline, automatically." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
