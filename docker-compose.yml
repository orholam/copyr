name: copyr

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copyr
      POSTGRES_PASSWORD: copyr
      POSTGRES_DB: copyr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyr -d copyr"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: copyr-dev
      MINIO_ROOT_PASSWORD: copyr-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 copyr-dev copyr-dev-secret &&
      mc mb --ignore-existing local/copyr-local &&
      exit 0"

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_WEBHOOK_URL: http://host.docker.internal:4100/api/v1/webhooks/inbound-email
      MP_WEBHOOK_LIMIT: 1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  miniodata:
